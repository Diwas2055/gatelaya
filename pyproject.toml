[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatelaya"
version = "0.1.0"
description = "Multilingual LLM guardrail pack: Laya decision model on LiteLLM Proxy"
requires-python = ">=3.12"
dependencies = [
    "litellm[proxy]",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "pydantic>=2",
]

[project.optional-dependencies]
redis = ["redis"]
model = ["laya"]                 # inference; brings torch + safetensors
train = ["laya", "torch", "safetensors"]  # fine-tuning (scripts/finetune.py)
dev = ["pytest", "pytest-asyncio", "aiosqlite", "httpx"]

[project.scripts]
gatelaya-dashboard = "dashboard.main:run"

# uv: `uv sync` installs dev group by default; model/redis via --extra
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "httpx",
    "ruff>=0.16.9",
]

[tool.setuptools]
packages = [
    "gatelaya",
    "custom_guardrail",
    "custom_guardrail.gatelaya",
    "dashboard",
    "dashboard.routers",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# Explicit set so CI is deterministic across ruff versions (0.16 expanded defaults)
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
