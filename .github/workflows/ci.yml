name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check gatelaya/ dashboard/ scripts/ tests/

      - name: Type-independent sanity — eval plumbing
        run: uv run scripts/eval.py --agent fake --limit 8

      - name: Tests (pytest)
        run: uv run pytest tests/ -q
